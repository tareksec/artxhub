// CyberHome build additions. Applied from the root build.gradle.
//
// cyber/res and cyber/src are added to every build type source set. Build type source sets
// have the highest priority in resource merging, so resources here override upstream ones
// with the same name (app icon, user-visible "Lawnchair" strings) without editing upstream files.
// cyber/debug holds debug-only code and manifest entries (design preview screen).

android {
    buildTypes.configureEach { buildType ->
        def sourceSet = sourceSets.maybeCreate(buildType.name)
        sourceSet.res.srcDirs += 'cyber/res'
        sourceSet.java.srcDirs += 'cyber/src'
    }
    sourceSets.debug {
        java.srcDirs += 'cyber/debug/src'
        manifest.srcFile 'cyber/debug/AndroidManifest.xml'
    }
}

/**
 * Regenerates cyber/res/values*&#47;cyber_rebrand_strings.xml from the upstream
 * lawnchair/res/values*&#47;strings.xml: every string, plurals or string-array that mentions
 * "Lawnchair" is copied with the name replaced by CyberHome.
 *
 * Run after every upstream merge:  ./gradlew cyberRebrandStrings
 */
abstract class CyberRebrandStringsTask extends DefaultTask {
    // Strings whose meaning would become false if the name were swapped.
    // search_provider_sponsored_description claims a revenue share with Lawnchair.
    static final Set<String> EXCLUDED = ['search_provider_sponsored_description'] as Set

    @InputDirectory
    abstract DirectoryProperty getUpstreamRes()

    @OutputDirectory
    abstract DirectoryProperty getOverlayRes()

    @TaskAction
    void generate() {
        def outRoot = overlayRes.get().asFile
        outRoot.eachDirMatch(~/values.*/) { dir ->
            new File(dir, 'cyber_rebrand_strings.xml').delete()
        }
        def element = ~/(?s)<(string|plurals|string-array)\b([^>]*)>(.*?)<\/\1>/
        int total = 0
        upstreamRes.get().asFile.eachDirMatch(~/values.*/) { dir ->
            def src = new File(dir, 'strings.xml')
            if (!src.exists()) return
            def text = src.getText('UTF-8').replaceAll(/(?s)<!--.*?-->/, '')
            def root = (text =~ /<resources[^>]*>/)
            if (!root.find()) return
            def entries = []
            def m = element.matcher(text)
            while (m.find()) {
                def name = (m.group(2) =~ /name="([^"]+)"/)
                if (!name.find() || name.group(1) in EXCLUDED) continue
                if (!m.group(3).contains('Lawnchair')) continue
                entries << "    <${m.group(1)}${m.group(2)}>${m.group(3).replace('Lawnchair', 'CyberHome')}</${m.group(1)}>"
            }
            if (entries.isEmpty()) return
            def outDir = new File(outRoot, dir.name)
            outDir.mkdirs()
            new File(outDir, 'cyber_rebrand_strings.xml').setText(
                '<?xml version="1.0" encoding="utf-8"?>\n' +
                    '<!-- SPDX-License-Identifier: GPL-3.0-or-later -->\n' +
                    '<!-- Generated by ./gradlew cyberRebrandStrings from lawnchair/res. Do not edit. -->\n' +
                    root.group() + '\n' + entries.join('\n') + '\n</resources>\n',
                'UTF-8')
            total += entries.size()
        }
        logger.lifecycle("cyberRebrandStrings: wrote ${total} overrides")
    }
}

/**
 * Generates the bundled dark dot-grid wallpapers into cyber/res/drawable-nodpi.
 * Pure code, no external art. Re-run after changing the parameters below:
 *   ./gradlew cyberWallpapers
 */
abstract class CyberWallpapersTask extends DefaultTask {
    // name -> [width, height, density]; density turns the dp tokens into pixels.
    static final Map<String, List<Number>> SIZES = [
        'cyber_wallpaper_1440x3120': [1440, 3120, 3.5f],
        'cyber_wallpaper_1080x2400': [1080, 2400, 2.625f],
    ]
    static final int BG = 0xFF0B0C0F            // cyber_bg
    static final int DOT = 0x0FFFFFFF           // cyber_bg_dot (~6% white)
    static final float DOT_SPACING_DP = 5f      // cyber_dot_spacing
    static final float DOT_RADIUS_DP = 0.75f    // cyber_dot_radius

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def outDir = outputDir.get().asFile
        SIZES.each { name, spec ->
            int w = spec[0] as int, h = spec[1] as int
            float density = spec[2] as float
            float spacing = Math.round(DOT_SPACING_DP * density)
            float r = DOT_RADIUS_DP * density
            def img = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_RGB)
            def g = img.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
            g.color = new java.awt.Color(BG, true)
            g.fillRect(0, 0, w, h)
            g.color = new java.awt.Color(DOT, true)
            // Center the grid so the margins are equal on both sides.
            float x0 = ((w % spacing) + spacing) / 2f
            float y0 = ((h % spacing) + spacing) / 2f
            for (float y = y0; y < h; y += spacing) {
                for (float x = x0; x < w; x += spacing) {
                    g.fill(new java.awt.geom.Ellipse2D.Double(x - r, y - r, 2 * r, 2 * r))
                }
            }
            g.dispose()
            javax.imageio.ImageIO.write(img, 'png', new File(outDir, "${name}.png"))
        }
        logger.lifecycle("cyberWallpapers: wrote ${SIZES.keySet()}")
    }
}

tasks.register('cyberWallpapers', CyberWallpapersTask) {
    group = 'cyber'
    description = 'Generates the dot-grid wallpapers in cyber/res/drawable-nodpi'
    outputDir = layout.projectDirectory.dir('cyber/res/drawable-nodpi')
}

tasks.register('cyberRebrandStrings', CyberRebrandStringsTask) {
    group = 'cyber'
    description = 'Regenerates rebranded string overrides in cyber/res'
    upstreamRes = layout.projectDirectory.dir('lawnchair/res')
    overlayRes = layout.projectDirectory.dir('cyber/res')
}
