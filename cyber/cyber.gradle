// CyberHome build additions. Applied from the root build.gradle.
//
// cyber/res and cyber/src are added to every build type source set. Build type source sets
// have the highest priority in resource merging, so resources here override upstream ones
// with the same name (app icon, user-visible "Lawnchair" strings) without editing upstream files.
// cyber/AndroidManifest.xml declares our components (widgets) for every build type.
// cyber/debug holds debug-only code and manifest entries (design preview screen); a source set
// has only one manifest, so it uses the variant source set of the debug build we ship.

android {
    // Our own version (shown in Android's app info and the APK name). versionCode stays upstream's,
    // so it keeps growing with upstream merges and updates install over older test builds.
    defaultConfig.versionName = '0.2.0'

    buildTypes.configureEach { buildType ->
        def sourceSet = sourceSets.maybeCreate(buildType.name)
        sourceSet.res.srcDirs += 'cyber/res'
        sourceSet.java.srcDirs += 'cyber/src'
        sourceSet.manifest.srcFile 'cyber/AndroidManifest.xml'
    }
    sourceSets.maybeCreate('lawnWithQuickstepGithubDebug').with {
        java.srcDirs += 'cyber/debug/src'
        manifest.srcFile 'cyber/debug/AndroidManifest.xml'
    }

    // Size (bug-fix/04, owner's choice): English only. Upstream's ~80 translations made
    // resources.arsc 5.4 MB. Translation files stay in the tree, they are just not packaged.
    androidResources {
        localeFilters += ['en']
    }
    // Real phones are ARM; x86 libraries are only for PC emulators (the debug build keeps them).
    buildTypes.named('release') {
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
}

/**
 * Copies cyber/templates/*.xml into a generated res/xml/ folder of one variant, replacing
 * @APP_ID@ with that variant's applicationId. Needed because default workspace layouts name
 * widget providers by package, and the debug build has a different package (.debug suffix).
 */
abstract class CyberLayoutTemplatesTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getTemplateDir()

    @Input
    abstract Property<String> getApplicationId()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def xmlDir = new File(outputDir.get().asFile, 'xml')
        xmlDir.mkdirs()
        templateDir.get().asFile.eachFileMatch(~/.*\.xml/) { template ->
            new File(xmlDir, template.name).setText(
                template.getText('UTF-8').replace('@APP_ID@', applicationId.get()), 'UTF-8')
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def generate = tasks.register("cyberGenerate${variant.name.capitalize()}LayoutTemplates", CyberLayoutTemplatesTask) {
            templateDir = layout.projectDirectory.dir('cyber/templates')
            applicationId = variant.applicationId
            outputDir = layout.buildDirectory.dir("generated/cyber/${variant.name}/res")
        }
        variant.sources.res.addGeneratedSourceDirectory(generate, { CyberLayoutTemplatesTask t -> t.outputDir })
    }
}

dependencies {
    // Weather refresh and water reminders (periodic, battery-friendly background work)
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
}

/**
 * Regenerates cyber/res/values*&#47;cyber_rebrand_strings.xml from the upstream
 * lawnchair/res/values*&#47;strings.xml: every string, plurals or string-array that mentions
 * "Lawnchair" is copied with the name replaced by CyberHome.
 *
 * Run after every upstream merge:  ./gradlew cyberRebrandStrings
 */
abstract class CyberRebrandStringsTask extends DefaultTask {
    // Strings whose meaning would become false if the name were swapped.
    // search_provider_sponsored_description claims a revenue share with Lawnchair.
    static final Set<String> EXCLUDED = ['search_provider_sponsored_description'] as Set

    @InputDirectory
    abstract DirectoryProperty getUpstreamRes()

    @OutputDirectory
    abstract DirectoryProperty getOverlayRes()

    @TaskAction
    void generate() {
        def outRoot = overlayRes.get().asFile
        outRoot.eachDirMatch(~/values.*/) { dir ->
            new File(dir, 'cyber_rebrand_strings.xml').delete()
        }
        def element = ~/(?s)<(string|plurals|string-array)\b([^>]*)>(.*?)<\/\1>/
        int total = 0
        upstreamRes.get().asFile.eachDirMatch(~/values.*/) { dir ->
            def src = new File(dir, 'strings.xml')
            if (!src.exists()) return
            def text = src.getText('UTF-8').replaceAll(/(?s)<!--.*?-->/, '')
            def root = (text =~ /<resources[^>]*>/)
            if (!root.find()) return
            def entries = []
            def m = element.matcher(text)
            while (m.find()) {
                def name = (m.group(2) =~ /name="([^"]+)"/)
                if (!name.find() || name.group(1) in EXCLUDED) continue
                if (!m.group(3).contains('Lawnchair')) continue
                entries << "    <${m.group(1)}${m.group(2)}>${m.group(3).replace('Lawnchair', 'CyberHome')}</${m.group(1)}>"
            }
            if (entries.isEmpty()) return
            def outDir = new File(outRoot, dir.name)
            outDir.mkdirs()
            new File(outDir, 'cyber_rebrand_strings.xml').setText(
                '<?xml version="1.0" encoding="utf-8"?>\n' +
                    '<!-- SPDX-License-Identifier: GPL-3.0-or-later -->\n' +
                    '<!-- Generated by ./gradlew cyberRebrandStrings from lawnchair/res. Do not edit. -->\n' +
                    root.group() + '\n' + entries.join('\n') + '\n</resources>\n',
                'UTF-8')
            total += entries.size()
        }
        logger.lifecycle("cyberRebrandStrings: wrote ${total} overrides")
    }
}

/**
 * Renders the widget picker preview image of the clock (android:previewImage, used before
 * Android 12; newer versions render android:previewLayout instead) into cyber/res/drawable-nodpi:
 *   ./gradlew cyberWidgetPreviews
 */
abstract class CyberWidgetPreviewsTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getFontDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def fonts = fontDir.get().asFile
        def black = java.awt.Font.createFont(java.awt.Font.TRUETYPE_FONT, new File(fonts, 'cyber_nunito_black.ttf'))
        def bold = java.awt.Font.createFont(java.awt.Font.TRUETYPE_FONT, new File(fonts, 'cyber_nunito_bold.ttf'))
        int size = 360
        def img = new java.awt.image.BufferedImage(size, size, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = img.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        g.setRenderingHint(java.awt.RenderingHints.KEY_TEXT_ANTIALIASING, java.awt.RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
        g.color = new java.awt.Color(0xFFFFFFFF as int, true)               // cyber_surface (light)
        g.fill(new java.awt.geom.RoundRectangle2D.Double(0, 0, size, size, 64, 64))

        def center = { String text, java.awt.Font font, int baseline, int argb ->
            g.font = font
            g.color = new java.awt.Color(argb, true)
            int w = g.fontMetrics.stringWidth(text)
            g.drawString(text, ((size - w) / 2) as int, baseline)
        }
        def digits = black.deriveFont(128f)
        center('06', digits, 150, 0xFF2B2A33 as int)                     // cyber_text
        g.color = new java.awt.Color(0xFFF28AAE as int, true)            // cyber_soft_pink
        g.fill(new java.awt.geom.RoundRectangle2D.Double(size / 2 - 22, 170, 44, 9, 9, 9))
        center('00', digits, 300, 0xFFD9578A as int)                     // cyber_accent_pink
        center('Oct 09 · Wed', bold.deriveFont(24f), 338, 0xFF8A8494 as int) // cyber_text_dim
        g.dispose()
        javax.imageio.ImageIO.write(img, 'png', new File(outputDir.get().asFile, 'cyber_widget_clock_preview.png'))
        logger.lifecycle('cyberWidgetPreviews: wrote cyber_widget_clock_preview.png')
    }
}

tasks.register('cyberWidgetPreviews', CyberWidgetPreviewsTask) {
    group = 'cyber'
    description = 'Renders widget picker preview images into cyber/res/drawable-nodpi'
    fontDir = layout.projectDirectory.dir('cyber/res/font')
    outputDir = layout.projectDirectory.dir('cyber/res/drawable-nodpi')
}

tasks.register('cyberRebrandStrings', CyberRebrandStringsTask) {
    group = 'cyber'
    description = 'Regenerates rebranded string overrides in cyber/res'
    upstreamRes = layout.projectDirectory.dir('lawnchair/res')
    overlayRes = layout.projectDirectory.dir('cyber/res')
}
