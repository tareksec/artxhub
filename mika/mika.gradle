// Mika Theme additions. Applied from the root build.gradle.

android {
    buildTypes.configureEach { buildType ->
        def sourceSet = sourceSets.maybeCreate(buildType.name)
        sourceSet.res.srcDirs += 'mika/res'
        sourceSet.java.srcDirs += 'mika/src'
    }

    // Merge Mika components via the 'withQuickstep' product flavor sourceSet
    sourceSets.maybeCreate('withQuickstep').with {
        manifest.srcFile 'mika/AndroidManifest.xml'
    }
}
